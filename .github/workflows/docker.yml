# Builds the Docker image for linux/amd64 and linux/arm64 and publishes it to
# GitHub's container registry at ghcr.io/dewberry/stac-x, one tag covering
# both. Pull requests only build, to catch a broken Dockerfile on either
# platform; pushes to main also push the image.
#
# Each platform builds on its own native runner (the repo is public, so the
# arm64 runners are free) and pushes the result by digest. A second job then
# writes one manifest list that points at both and carries the tags. Building
# arm64 under QEMU on the amd64 runner instead took six times as long for
# `next build` alone.
#
# Every push to main is a release with its own version. package.json names
# the series (1.2.x) and the `version` job counts the last number up from
# the tags already there, so the first merge after package.json says 1.2.0
# is v1.2.0, the next v1.2.1, and so on. The build is told that version, the
# app shows it, and once the image is published the commit is tagged and a
# GitHub release written with the pull requests since the last one. Nothing
# is committed back to main. To start a new series, change package.json's
# version in a pull request (1.3.0, or 2.0.0).
#
# Tags: `latest`, `sha-<short sha>`, `1.2.3` and `1.2` for every push to main.
name: Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# contents: write is for the tag and the release, in the last job only.
permissions:
  contents: write
  packages: write

# A newer push to the same branch supersedes the older build, so cancel it.
# Those show up as "cancelled" runs, not failures.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Spelled out rather than taken from github.repository, which is
# "Dewberry/stac-x": image names must be lowercase and buildx won't fold it.
env:
  IMAGE: ghcr.io/dewberry/stac-x

jobs:
  # Works out the version this run builds. Anywhere but a push to main that's
  # package.json's as it stands, and nothing gets tagged.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick the version
        id: pick
        run: |
          base="$(jq -r .version package.json)"
          version="$base"
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            release=true
            series="${base%.*}"
            floor="${base##*.}"
            # Tags are asked of the remote, so the checkout can stay shallow.
            tags="$(git ls-remote --tags origin "refs/tags/v$series.*" | grep -v '\^{}' || true)"
            # A re-run of a commit that already has its tag keeps that version.
            mine="$(awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/v", "", $2); print $2 }' <<< "$tags" | head -n 1)"
            last="$(sed -E 's#.*refs/tags/v[0-9]+\.[0-9]+\.##' <<< "$tags" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)"
            if [ -n "$mine" ]; then
              version="$mine"
            elif [ -n "$last" ]; then
              next=$((last + 1))
              if [ "$next" -lt "$floor" ]; then next="$floor"; fi
              version="$series.$next"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Building $version (release: $release)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here; the tags go on the manifest list below.
      - name: Work out image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # The platform name doubles as a cache scope so the two architectures
      # don't evict each other's layers from the Actions cache.
      - name: Platform slug
        id: slug
        run: echo "name=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Production serves the app at ffrd.cloud.dewberryanalytics.com/stac.
          # APP_VERSION and APP_COMMIT are what the app shows as its version.
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/stac
            APP_VERSION=${{ needs.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ steps.slug.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.slug.outputs.name }}

      - name: Save digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.slug.outputs.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-platform images into one manifest list and tags it,
  # then tags the commit and writes the release.
  merge:
    if: github.event_name != 'pull_request'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

      # Last, so a version is only ever claimed by an image that exists. The
      # tag made here doesn't start another run of this workflow.
      - name: Tag the commit and write the release
        if: needs.version.outputs.release == 'true'
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released."
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
